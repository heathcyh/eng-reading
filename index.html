<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>積點樂園｜選擇版本</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E5BBA">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script>
// 記住上次選的版本：直接進入（舊版捷徑也會自動帶到正確版本）
(function(){ try{
  var p=new URLSearchParams(location.search);
  if(p.has("pick")) { localStorage.removeItem("eng-edition"); return; }
  var e=localStorage.getItem("eng-edition");
  if(e==="es"||e==="jh") location.replace("./"+e+"/");
}catch(err){} })();
</script>
<style>
body{margin:0;background:#FBF7EF;color:#1F2A44;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.w{max-width:520px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:26px;margin:0 0 6px}
p{color:#6B7385;line-height:1.7;font-size:15px;margin:0 0 18px}
a.c{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:#fff;border:2px solid #ECE5D6;border-radius:18px;padding:16px;margin-bottom:12px}
a.c img{width:64px;height:64px;border-radius:16px}
a.c b{display:block;font-size:20px}
a.c span{color:#6B7385;font-size:14px;line-height:1.6}
a.es{border-color:#2E5BBA} a.jh{border-color:#E0761B}
.n{font-size:13.5px;background:#FFF8E6;border:1px solid #F5DFA8;border-radius:12px;padding:12px;line-height:1.7;color:#3d4660}
code{background:#fff;border:1px solid #ECE5D6;border-radius:6px;padding:1px 5px;font-size:12.5px}
</style>
</head>
<body><div class="w">
<h1>🏆 積點樂園</h1>
<p>請選擇要使用的版本。兩個版本的點數分開計算，各自兌換 3C 時間。</p>
<a class="c es" href="es/" onclick="try{localStorage.setItem('eng-edition','es')}catch(e){}"><img src="es/icon-192.png" alt=""><div><b>國小版</b><span>小四～小六英文、數學<br>累積「弟弟點數」</span></div></a>
<a class="c jh" href="jh/" onclick="try{localStorage.setItem('eng-edition','jh')}catch(e){}"><img src="jh/icon-192.png" alt=""><div><b>國中版</b><span>國一～國三英文、數學、特訓、社會段考複習<br>累積「柚子點數」</span></div></a>
<div class="n">📲 建議在各自的手機用 Chrome（iPhone 用 Safari）直接開啟版本網址，再「加到主畫面」：<br>國小版 <code>heathcyh.github.io/eng-reading/es/</code><br>國中版 <code>heathcyh.github.io/eng-reading/jh/</code><br>之前的點數與作答紀錄，第一次打開新版本時會自動轉入。</div>
</div>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
